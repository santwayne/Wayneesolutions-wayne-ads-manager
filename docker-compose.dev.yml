# Local dev only: Postgres + Redis. Production uses EC2 + managed services (docs/DEPLOY.md).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: wayne, POSTGRES_PASSWORD: wayne, POSTGRES_DB: wayne_ads_dev }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
